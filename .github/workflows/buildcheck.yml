name: Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net10.0-windows10.0.19041.0
            rid: win-x64
          - os: ubuntu-latest
            framework: net10.0
            rid: linux-x64
          - os: macos-latest
            framework: net10.0
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: >-
          dotnet build "QwQ Music/QwQ Music.csproj" -c Release
          -f "${{ matrix.framework }}" -r "${{ matrix.rid }}"
